# Standard ACP ports: WirePlumber owns automatic switching and route volumes.
[General]
auto-profiles = no

[Mapping s9plus-stereo]
device-strings = hw:%f,0
channel-map = left,right
paths-output = s9plus-speaker s9plus-headphones
direction = output
description = Speakers / Headphones

[Profile output:s9plus-stereo]
description = Speakers / Headphones
output-mappings = s9plus-stereo
priority = 100

# Use normal software volume for desktop controls. The codec gain ceiling is
# enforced independently by the kernel, including direct ALSA and boosted PCM.
# Avoid compensating a speaker mixer gain on the separate headphone path.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.platform-snd-zrn-abox.*" } ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        api.alsa.use-ucm = false
        device.profile-set = "s9plus.conf"
      }
    }
  }
]

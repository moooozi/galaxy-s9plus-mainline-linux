name: Mobile images
on:
  workflow_dispatch:
    inputs:
      rebuild_gnome:
        description: Rebuild GNOME Mobile packages instead of reusing the matching cache
        type: boolean
        default: false
# Legacy Ubuntu builds remain available manually while Debian/postmarketOS
# pipelines are prepared. Driver pushes must not launch obsolete image builds.
permissions:
  contents: read
concurrency:
  group: mobile-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    uses: ./.github/workflows/mobile-kernel.yml
  gnome-packages:
    uses: ./.github/workflows/gnome-mobile.yml
    with:
      rebuild: ${{ inputs.rebuild_gnome == true }}
  kde:
    needs: kernel
    uses: ./.github/workflows/mobile-rootfs.yml
    with:
      variant: kde
  gnome:
    needs: [kernel, gnome-packages]
    uses: ./.github/workflows/mobile-rootfs.yml
    with:
      variant: gnome

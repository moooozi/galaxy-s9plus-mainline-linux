name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Script syntax and regression tests
        run: python3 scripts/ci/check-source.py
      - name: Workflow validation
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
  signing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify image repository signing credentials
        uses: ./.github/actions/gpg-signing
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: ${{ vars.GPG_SIGNING_KEY_FINGERPRINT }}
      - name: Remove ephemeral GPG keyring
        if: always()
        run: python3 .github/actions/gpg-signing/cleanup.py

name: GNOME Mobile packages
on:
  workflow_call:
    inputs:
      rebuild:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      rebuild:
        description: Ignore the matching package cache
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Restore the matching successful package build
        id: cache
        if: ${{ !inputs.rebuild }}
        uses: actions/cache/restore@v4
        with:
          path: dist/gnome-mobile-packages
          key: gnome-stonking-arm64-v1-${{ hashFiles('image/gnome-mobile/**', 'scripts/ci/build-gnome-mobile.py', 'scripts/ci/fetch-locked-source.py') }}-${{ github.run_id }}
          restore-keys: |
            gnome-stonking-arm64-v1-${{ hashFiles('image/gnome-mobile/**', 'scripts/ci/build-gnome-mobile.py', 'scripts/ci/fetch-locked-source.py') }}-
      - name: Build native ARM64 packages in the target Ubuntu userspace
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/work" -w /work ubuntu:26.10 bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends python3 ca-certificates
            python3 scripts/ci/build-gnome-mobile.py
          ' 2>&1 | tee /tmp/gnome-mobile.log
      - name: Verify package artifact checksums
        run: cd dist/gnome-mobile-packages && sha256sum -c SHA256SUMS
      - name: Cache only a complete verified build
        if: steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: dist/gnome-mobile-packages
          key: gnome-stonking-arm64-v1-${{ hashFiles('image/gnome-mobile/**', 'scripts/ci/build-gnome-mobile.py', 'scripts/ci/fetch-locked-source.py') }}-${{ github.run_id }}
      - name: Packages, corresponding source and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: gnome-mobile-packages
          path: dist/gnome-mobile-packages/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-mobile-failure-log
          path: /tmp/gnome-mobile.log
          if-no-files-found: ignore
